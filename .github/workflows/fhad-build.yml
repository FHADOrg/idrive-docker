name: FHAD IDrive image

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Dockerfile.fhad
      - scripts/**
      - .github/workflows/fhad-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/*.sh
      - name: Smoke tests
        run: bash tests/test-backup-once.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish FHAD image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fhad
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/fhadorg/idrive-docker:0.1.0
